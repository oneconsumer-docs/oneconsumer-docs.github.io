<header class="site-header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <a href="{{ site.baseurl }}/">
          <img src="{{ site.baseurl }}/assets/images/ocs-logo-black.svg" alt="OneConsumer" height="32">
        </a>
      </div>

      <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav">
        <ul class="nav-list">
          {% for item in site.navigation %}
            <li class="nav-item{% if item.subnav %} has-subnav{% endif %}">
              {% if item.external %}
                <a href="{{ item.url }}" class="nav-link cta-link" target="_blank" rel="noopener">{{ item.title }} →</a>
              {% else %}
                <a href="{{ site.baseurl }}{{ item.url }}" class="nav-link{% if page.url contains item.url %} active{% endif %}">{{ item.title }}</a>
                {% if item.subnav %}
                  <ul class="subnav">
                    {% for subitem in item.subnav %}
                      <li><a href="{{ site.baseurl }}{{ subitem.url }}">{{ subitem.title }}</a></li>
                    {% endfor %}
                  </ul>
                {% endif %}
              {% endif %}
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Primary Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.tagline }}{% endif %}</title>
  <meta name="title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.png">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  <!-- Alternate for India locale -->
  <link rel="alternate" href="{{ site.website }}" hreflang="en-IN">

  <!-- Schema.org structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "OneConsumer",
    "url": "{{ site.website }}",
    "logo": "{{ site.url }}{{ site.baseurl }}/assets/images/logo.png",
    "description": "{{ site.description }}",
    "areaServed": "IN",
    "sameAs": ["{{ site.website }}"],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Support",
      "areaServed": "IN",
      "availableLanguage": "en"
    }
  }
  </script>

  {% if page.layout == 'doc' or page.faq %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{% if page.faq %}FAQPage{% else %}Article{% endif %}",
    "headline": "{{ page.title }}",
    "description": "{{ page.description | default: site.description }}",
    "author": {
      "@type": "Organization",
      "name": "OneConsumer"
    },
    "publisher": {
      "@type": "Organization",
      "name": "OneConsumer",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.baseurl }}/assets/images/logo.png"
      }
    }
  }
  </script>
  {% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montaga&family=Martel+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- SEO Plugin -->
  {% seo %}
</head>

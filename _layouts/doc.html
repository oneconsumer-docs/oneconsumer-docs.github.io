---
layout: default
---

<div class="doc-page">
  {% include breadcrumbs.html %}

  <article class="doc-article">
    {% if page.title %}
    <header class="doc-header">
      <h1 class="doc-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="doc-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    {% endif %}

    <div class="content">
      {{ content }}
    </div>

    {% if page.cta != false %}
    <div class="doc-cta">
      <a href="{{ page.cta_url | default: site.website }}" class="cta-button" target="_blank" rel="noopener">
        {{ page.cta | default: "Try OneConsumer now →" }}
      </a>
    </div>
    {% endif %}
  </article>
</div>

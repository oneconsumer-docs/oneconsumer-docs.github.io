---
layout: default
---

<div class="page-wrapper">
  <article class="page-article">
    {% if page.title %}
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    {% endif %}

    <div class="content">
      {{ content }}
    </div>

    {% if page.cta %}
    <div class="doc-cta">
      <a href="{{ page.cta_url | default: site.website }}" class="cta-button" target="_blank" rel="noopener">
        {{ page.cta }}
      </a>
    </div>
    {% endif %}
  </article>
</div>
